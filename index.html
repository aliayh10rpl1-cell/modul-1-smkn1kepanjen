```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teh Hijau - Tulus</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #dfeee0, #8fb996);
        }

        .music-player {
            width: 350px;
            padding: 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .cover {
            width: 180px;
            height: 180px;
            margin: auto;
            border-radius: 20px;
            background: linear-gradient(135deg, #477a52, #a8d5a2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 70px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        h1 {
            margin-top: 25px;
            font-size: 26px;
            color: #254b2b;
        }

        h2 {
            margin-top: 8px;
            font-size: 16px;
            font-weight: normal;
            color: #666;
        }

        .progress {
            width: 100%;
            margin-top: 25px;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .time {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 20px;
            cursor: pointer;
            background: #477a52;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.08);
            background: #315c3a;
        }

        .play {
            width: 65px;
            height: 65px;
            font-size: 25px;
        }

        .status {
            margin-top: 20px;
            color: #477a52;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="music-player">

        <div class="cover">🍵</div>

        <h1>Teh Hijau</h1>
        <h2>Tulus</h2>

        <div class="progress">
            <input type="range" id="progress" min="0" max="100" value="0">

            <div class="time">
                <span id="current">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="buttons">
            <button onclick="stop()">⏹</button>
            <button class="play" onclick="playPause()" id="playButton">▶</button>
            <button onclick="next()">⏭</button>
        </div>

        <div class="status" id="status">
            Siap diputar 🎵
        </div>

    </div>

<script>

let audioContext;
let oscillator;
let isPlaying = false;
let currentNote = 0;
let timer;

const notes = [
    261.63,
    293.66,
    329.63,
    392.00,
    329.63,
    293.66,
    261.63,
    392.00
];

function playPause() {

    if (isPlaying) {
        pause();
    } else {
        play();
    }

}

function play() {

    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    isPlaying = true;

    document.getElementById("playButton").innerHTML = "⏸";
    document.getElementById("status").innerHTML = "Sedang diputar 🎵";

    playNote();

}

function playNote() {

    if (!isPlaying) return;

    oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.frequency.value = notes[currentNote];

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    gain.gain.setValueAtTime(0.15, audioContext.currentTime);

    oscillator.stop(audioContext.currentTime + 0.4);

    currentNote++;

    if (currentNote >= notes.length) {
        currentNote = 0;
    }

    timer = setTimeout(playNote, 450);

}

function pause() {

    isPlaying = false;

    clearTimeout(timer);

    document.getElementById("playButton").innerHTML = "▶";
    document.getElementById("status").innerHTML = "Dijeda ⏸";

}

function stop() {

    isPlaying = false;

    clearTimeout(timer);

    currentNote = 0;

    document.getElementById("playButton").innerHTML = "▶";
    document.getElementById("status").innerHTML = "Berhenti ⏹";
    document.getElementById("progress").value = 0;

}

function next() {

    currentNote++;

    if (currentNote >= notes.length) {
        currentNote = 0;
    }

    document.getElementById("status").innerHTML =
        "Nada berikutnya 🎶";

}

</script>

</body>
</html>
